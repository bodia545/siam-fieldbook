<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0D2238">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Field Book">
<title>Field Book · Siam HVAC</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/*
 VOICE   a calm foreman beside a beginner: one step at a time, plain words
 IDEA    service tag + illustrated work card: a drawing of the real parts with numbered yellow pins
 PICTURE each step opens on a 3D-tilted drawing whose pins pulse and whose arrows march to the exact part
 COLOUR  navy header, paper ground, teal = go, amber = call/pin, red = stop
 TYPE    Barlow Condensed stamped titles, Barlow for reading
*/
:root{--navy:#0D2238;--navy2:#16324F;--teal:#10A39A;--teal2:#7FE0D6;--steel:#DCE3E8;--steel2:#C3CDD6;--paper:#F4F7F9;--ink:#12202E;--muted:#5B6B7A;--amber:#F2A900;--red:#C8312B;--green:#1E8A4C;--blue:#2B63D9;--violet:#6D44C9;
 --cond:"Barlow Condensed","Arial Narrow",sans-serif;--body:Barlow,system-ui,sans-serif;--ease:cubic-bezier(.2,.8,.2,1)}
*{box-sizing:border-box;min-width:0}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:17px/1.5 var(--body);overflow-x:clip}
a{color:var(--teal);font-weight:600}
button,input,textarea,select{font:inherit}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
h1,h2,h3{font-family:var(--cond);font-weight:700;line-height:1.05;margin:0;color:var(--navy)}
.app{max-width:560px;margin:0 auto;min-height:100vh;background:var(--paper);position:relative;padding-bottom:calc(84px + env(safe-area-inset-bottom));perspective:1400px}
@media(min-width:700px){body{background:#E6ECF0}.app{box-shadow:0 0 0 1px var(--steel2),0 30px 80px #0d22381f}}
/* header */
.hd{background:var(--navy);color:#fff;padding:calc(18px + env(safe-area-inset-top)) 20px 18px;position:relative;overflow:hidden}
.hd.red{background:var(--red)}
.hd::after{content:"";position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,#10A39A40,transparent 70%);animation:glow 6s ease-in-out infinite}
.hd.red::after{background:radial-gradient(circle,#ffffff30,transparent 70%)}
@keyframes glow{50%{transform:translate(-30px,20px) scale(1.2)}}
.eyebrow{font:700 13px var(--cond);letter-spacing:.06em;color:var(--teal2);text-transform:uppercase}
.hd.red .eyebrow{color:#ffd9d6}
.hd h1{color:#fff;font-size:clamp(28px,7vw,36px);margin-top:4px;text-wrap:balance}
.hd .back{color:#b9c8d6;text-decoration:none;font-weight:600;font-size:15px;display:inline-block;margin-bottom:8px}
.hd .help{position:absolute;right:16px;top:calc(16px + env(safe-area-inset-top));width:40px;height:40px;border-radius:50%;background:#ffffff1a;color:#fff;display:grid;place-items:center;text-decoration:none;font:700 20px var(--cond);z-index:2}
.bar{height:8px;background:#ffffff26;border-radius:9px;margin-top:12px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--teal);border-radius:9px;transition:width .8s var(--ease)}
.barlbl{font-size:14px;color:#cfdbe6;margin-top:6px}
main{padding:16px}
/* view transitions (3D) */
.view{animation:inF .5s var(--ease) both;transform-origin:50% 0}
.view.back{animation-name:inB}
@keyframes inF{from{opacity:0;transform:translateX(40px) rotateY(-8deg)}}
@keyframes inB{from{opacity:0;transform:translateX(-40px) rotateY(8deg)}}
.view.still .st>*{animation:none}.st>*{animation:up .55s var(--ease) both;animation-delay:calc(var(--i,0)*70ms + 120ms)}
@keyframes up{from{opacity:0;transform:translateY(18px)}}
/* cards */
.card{background:#fff;border-radius:16px;padding:18px;margin-top:14px;box-shadow:0 1px 0 var(--steel2),0 8px 24px #0d22380d}
.card h2{font-size:24px;margin-bottom:8px}
.plain{background:#E3F5F3;box-shadow:none}
.tag{position:relative;background:#fff;border-radius:8px 20px 20px 8px;padding:20px 20px 20px 26px;border-left:10px solid var(--teal);box-shadow:0 2px 0 var(--steel2),0 14px 30px #0d22381a;display:block;color:inherit;text-decoration:none;transform-style:preserve-3d;transition:transform .25s var(--ease)}
.tag .when{font:700 14px var(--cond);color:var(--teal);letter-spacing:.05em;text-transform:uppercase}
.tag h3{font-size:30px;margin:6px 0 6px}
.tag .where{color:var(--muted);font-size:15px}
.tag.done{border-left-color:var(--green)}
.tag.small h3{font-size:22px}
.muted{color:var(--muted)}
/* buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:54px;padding:0 18px;border-radius:12px;border:0;background:var(--teal);color:#fff;font:700 18px var(--body);text-decoration:none;cursor:pointer;margin-top:12px;box-shadow:0 4px 0 #0b7a73;transition:transform .12s,box-shadow .12s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #0b7a73}
.btn.amber{background:var(--amber);color:var(--navy);box-shadow:0 4px 0 #b37e00}
.btn.red{background:var(--red);box-shadow:0 4px 0 #8e211c}
.btn.ghost{background:var(--steel);color:var(--navy);box-shadow:0 4px 0 var(--steel2)}
.btn.glow{animation:btnglow 1.4s ease-in-out infinite}
@keyframes btnglow{50%{box-shadow:0 4px 0 #0b7a73,0 0 0 8px #10A39A33}}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.row2 .btn{margin-top:10px;font-size:16px}
/* checklist */
.chk{display:flex;gap:14px;align-items:flex-start;padding:14px 0;border-top:1px solid #E6ECF0;cursor:pointer}
.chk:first-of-type{border-top:0}
.chk input{appearance:none;flex:0 0 28px;width:28px;height:28px;border:3px solid var(--teal);border-radius:8px;margin:0;display:grid;place-items:center;cursor:pointer;transition:background .2s}
.chk input:checked{background:var(--teal);animation:pop .3s}
.chk input:checked::after{content:"";width:8px;height:14px;border:solid #fff;border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-2px)}
@keyframes pop{50%{transform:scale(1.25)}}
.chk.on .txt{color:var(--muted);text-decoration:line-through;text-decoration-color:#0003}
/* tags */
.chip{display:inline-block;font:700 12px var(--cond);letter-spacing:.06em;color:#fff;padding:3px 8px;border-radius:5px;margin-bottom:4px}
.c-COPY{background:var(--blue)}.c-EXTRACT{background:var(--violet)}.c-MOVE{background:var(--teal)}.c-SEE{background:var(--amber);color:var(--navy)}.c-CHECK{background:var(--navy)}.c-CAREFUL{background:var(--red)}
/* pins */
.pin{flex:0 0 36px;width:36px;height:36px;border-radius:50%;background:var(--amber);border:3px solid var(--navy);display:grid;place-items:center;font:700 19px var(--cond);color:var(--navy)}
.task.on .pin{background:var(--green);color:#fff;border-color:var(--green)}
.task{display:flex;gap:12px;padding:14px 0;border-top:1px solid #E6ECF0;align-items:flex-start}
.task:first-of-type{border-top:0}
.task .body{flex:1}
.task .tick{appearance:none;flex:0 0 30px;width:30px;height:30px;border:3px solid var(--steel2);border-radius:50%;margin:3px 0 0;display:grid;place-items:center;cursor:pointer}
.task .tick:checked{background:var(--green);border-color:var(--green);animation:pop .3s}
.task .tick:checked::after{content:"";width:7px;height:13px;border:solid #fff;border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-2px)}
/* illustration (3D) */
.ill{margin:16px 0 0;perspective:900px}
.ill .stage{background:linear-gradient(180deg,#EAF0F4,#DCE5EC);border-radius:18px;transform:rotateX(9deg);transform-style:preserve-3d;box-shadow:0 22px 30px -18px #0d223866,inset 0 1px 0 #fff;transition:transform .3s var(--ease);animation:float 7s ease-in-out infinite;overflow:hidden}
@keyframes float{50%{transform:rotateX(5deg) translateY(-4px)}}
.ill svg{display:block;width:100%;height:auto}
.ill .cap{font-size:13px;color:var(--muted);text-align:center;margin-top:8px}
.ppulse{transform-box:fill-box;transform-origin:center;animation:ping 1.8s ease-out infinite}
@keyframes ping{from{opacity:.7;transform:scale(1)}to{opacity:0;transform:scale(2.2)}}
.arrow{stroke-dasharray:6 6;animation:march .9s linear infinite}
@keyframes march{to{stroke-dashoffset:-12}}
.flowline{stroke-dasharray:8 8;animation:march .8s linear infinite}
.fan{transform-box:fill-box;transform-origin:center;animation:spin 3s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.pinG.hit circle.pb{fill:#1E8A4C}.pinG.hit text{fill:#fff}
.pinG.focus circle.pb{animation:bounce .6s var(--ease)}
@keyframes bounce{40%{transform:scale(1.35)}}
.pinG circle.pb{transform-box:fill-box;transform-origin:center}
/* result boxes */
.ok,.no{border-radius:14px;padding:14px 16px;margin-top:14px;border:2px solid}
.ok{background:#E2F3E8;border-color:#9fd3b2}.ok b{color:var(--green)}
.no{background:#FBE5E3;border-color:#efb1ab}.no b{color:var(--red)}
.ok p,.no p{margin:4px 0 0;font-size:15px}
.note{border-radius:12px;padding:12px 14px;margin-top:14px;font-size:15px;border-left:6px solid var(--teal);background:#E3F5F3}
.note.stop{border-color:var(--red);background:#FBE5E3}.note.warn{border-color:var(--amber);background:#FFF4D6}.note.go{border-color:var(--green);background:#E2F3E8}
/* widgets */
.widget{background:#fff;border-radius:16px;padding:16px;margin-top:14px;box-shadow:0 1px 0 var(--steel2)}
.widget h3{font-size:20px;margin-bottom:8px}
.needle{transform-origin:150px 120px;transition:transform 1.4s cubic-bezier(.3,1.4,.5,1)}
.big{font:700 52px/1 var(--cond);color:var(--navy);text-align:center;font-variant-numeric:tabular-nums}
.meaning{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.meaning button{border-radius:14px;padding:14px;text-align:left;cursor:pointer;border:2px solid;background:#fff;min-height:120px}
.meaning .lo{border-color:var(--red)}.meaning .hi{border-color:var(--green)}
.meaning b{display:block;font:700 24px var(--cond)}
.meaning .lo b{color:var(--red)}.meaning .hi b{color:var(--green)}
.meaning span{font-size:14px;color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:16px}th{background:var(--navy);color:#fff;font:600 15px var(--cond);letter-spacing:.05em;padding:8px}td{padding:9px 8px;text-align:right;border-bottom:1px solid #E6ECF0;font-variant-numeric:tabular-nums;white-space:nowrap}td:first-child{text-align:left}
/* step list on job page */
.steprow{display:flex;gap:14px;align-items:center;padding:12px 0;border-top:1px solid #E6ECF0;color:inherit;text-decoration:none}
.steprow:first-of-type{border-top:0}
.steprow .n{flex:0 0 40px;height:40px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font:700 20px var(--cond)}
.steprow.done .n{background:var(--green)}
.steprow .t{flex:1;font-weight:600}.steprow .t small{display:block;color:var(--muted);font-weight:400;font-size:14px}
.steprow .go{color:var(--teal);font-size:22px}
/* nameplate */
.plate{position:relative;background:linear-gradient(160deg,#EEF2F5,var(--steel) 55%,#CBD4DC);border-radius:12px;padding:22px;color:var(--ink);text-decoration:none;display:block;box-shadow:inset 0 1px 0 #fff,inset 0 -1px 0 #aab6c1,0 10px 24px #0d22381f;transform-style:preserve-3d;transition:transform .25s var(--ease)}
.plate::before,.plate::after{content:"";position:absolute;top:10px;width:10px;height:10px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff,#8e9ba7 70%)}
.plate::before{left:10px}.plate::after{right:10px}
.plate .brandline{font:700 13px var(--cond);letter-spacing:.12em;color:var(--muted)}
.plate .model{font:700 32px/1 var(--cond);color:var(--navy);margin:4px 0 12px}
.plate dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0;font-size:15px}
.plate dt{font:600 13px var(--cond);color:var(--muted);letter-spacing:.06em;text-transform:uppercase;padding-top:2px}
.plate dd{margin:0}
.watch{background:#FFF4D6;border:2px solid #f3d27a}
.watch li{margin:6px 0;font-size:15px}
/* bottom nav */
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(560px,100%);display:grid;grid-template-columns:repeat(5,1fr);background:#fff;border-top:1px solid var(--steel2);padding-bottom:env(safe-area-inset-bottom);z-index:30}
.nav a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 0 9px;text-decoration:none;color:var(--muted);font:600 12px var(--body)}
.nav a svg{width:24px;height:24px}
.nav a.on{color:var(--teal)}
.nav a.on svg{animation:pop .35s}
/* inputs */
label.f{display:block;font:600 15px var(--body);margin-top:12px}
label.f input,label.f textarea,label.f select,.search{display:block;width:100%;margin-top:4px;border:2px solid var(--steel2);border-radius:12px;padding:12px 14px;font-size:16px;background:#fff}
.search{margin:0 0 4px}
details.more{margin-top:14px}details.more summary{cursor:pointer;font-weight:700;color:var(--navy);padding:6px 0}
/* stop screen */
.stopnum{display:flex;gap:12px;align-items:flex-start;padding:10px 0}
.shake{animation:shake .5s}@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
/* login */
.login{min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 30% 20%,#16324F,#0D2238 70%);padding:24px;perspective:1000px}
.login .card{width:min(400px,100%);padding:28px;text-align:center;animation:flipin .8s var(--ease)}
@keyframes flipin{from{opacity:0;transform:rotateX(-30deg) translateY(30px)}}
.login .card.ok{animation:flipout .5s var(--ease) forwards}
@keyframes flipout{to{opacity:0;transform:rotateY(80deg) scale(.9)}}
.dots{display:flex;gap:16px;justify-content:center;margin:6px 0 18px}.dots span{width:18px;height:18px;border-radius:50%;border:3px solid var(--navy);transition:.2s}.dots span.on{background:var(--teal);border-color:var(--teal);transform:scale(1.15)}
.pad{display:grid;grid-template-columns:repeat(3,74px);gap:14px;justify-content:center}.pad button{height:74px;border-radius:50%;border:0;background:var(--steel);color:var(--navy);font:700 30px var(--cond);cursor:pointer;box-shadow:0 4px 0 var(--steel2)}.pad button:active{background:var(--teal);color:#fff;transform:translateY(3px);box-shadow:none}
/* dialog + toast */
.dlg{position:fixed;inset:0;background:#0D2238b3;display:grid;place-items:end center;z-index:60;padding:16px;animation:fade .2s}
.dlg .card{width:min(520px,100%);animation:up .35s var(--ease)}
@keyframes fade{from{opacity:0}}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--navy);color:#fff;padding:12px 18px;border-radius:12px;z-index:70;box-shadow:0 8px 24px #0006;animation:up .3s var(--ease)}
.burst{position:fixed;pointer-events:none;z-index:80;width:10px;height:10px;border-radius:2px;animation:burst .9s var(--ease) forwards}
@keyframes burst{to{transform:translate(var(--x),var(--y)) rotate(var(--r));opacity:0}}
.empty{padding:28px;text-align:center;color:var(--muted)}
.map{position:relative;border-radius:14px;overflow:hidden;margin-top:12px;height:220px;background:#DCE5EC;box-shadow:inset 0 0 0 1px var(--steel2)}
.map iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.mappin{position:absolute;left:50%;top:50%;width:44px;height:44px;margin:-44px 0 0 -22px;pointer-events:none;animation:drop .8s var(--ease) both .3s}
@keyframes drop{from{transform:translateY(-60px);opacity:0}70%{transform:translateY(4px)}}
.mappin::after{content:"";position:absolute;left:12px;bottom:-6px;width:20px;height:8px;border-radius:50%;background:#0003;animation:ping 1.8s ease-out infinite}
.photos{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:10px}
.photos button{padding:0;border:0;border-radius:10px;overflow:hidden;aspect-ratio:1;background:#DCE5EC;cursor:pointer}
.photos img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .3s}
.photos button:hover img{transform:scale(1.06)}
.visit{font:700 15px var(--cond);color:var(--navy);margin-top:14px;letter-spacing:.03em}
.visit small{font:500 13px var(--body);color:var(--muted)}
.lb{position:fixed;inset:0;background:#000e;z-index:90;display:flex;flex-direction:column;animation:fade .2s}
.lb img{flex:1;min-height:0;width:100%;object-fit:contain;animation:zoomin .3s var(--ease)}
@keyframes zoomin{from{transform:scale(.9);opacity:0}}
.lb .lbbar{display:flex;justify-content:space-between;align-items:center;color:#fff;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;font-size:15px}
.lb .lbnav{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px 16px calc(16px + env(safe-area-inset-bottom))}
.lb .lbnav button,.lb .lbbar button{min-height:50px;border-radius:12px;border:0;background:#ffffff22;color:#fff;font:700 17px var(--body);padding:0 16px;cursor:pointer}
.st3{display:grid;grid-template-columns:1fr 1fr;gap:10px}.st3 .btn{margin-top:10px;font-size:16px}
.snapprev[hidden]{display:none}.snapprev{width:100%;border-radius:12px;margin-top:12px;display:block;max-height:340px;object-fit:contain;background:#0D2238}
.view.still{animation:none}
.ico{width:28px;height:28px}
.nextcard{background:var(--navy);color:#fff;border-radius:20px;padding:20px;margin-top:14px;position:relative;overflow:hidden;box-shadow:0 14px 30px #0d223840}
.nextcard::after{content:"";position:absolute;right:-50px;bottom:-60px;width:180px;height:180px;border-radius:50%;background:radial-gradient(circle,#10A39A55,transparent 70%)}
.nextcard .lbl{font:700 14px var(--cond);letter-spacing:.08em;color:var(--teal2)}
.nextcard .what{font:700 30px/1.1 var(--cond);margin:6px 0 4px}
.nextcard .why{color:#cfdbe6;font-size:15px}
.nextcard .btn{font-size:20px;min-height:62px;margin-top:16px;position:relative;z-index:1}
.road{background:#fff;border-radius:18px;padding:6px 16px;margin-top:14px;box-shadow:0 1px 0 var(--steel2)}
.road a{display:flex;gap:14px;align-items:center;padding:13px 0;color:inherit;text-decoration:none;position:relative}
.road a+a{border-top:1px solid #E6ECF0}
.road .dot{flex:0 0 46px;height:46px;border-radius:50%;display:grid;place-items:center;background:var(--steel);color:var(--navy);position:relative}
.road .dot svg{width:24px;height:24px}
.road a.done .dot{background:var(--green);color:#fff}
.road a.now .dot{background:var(--amber);color:var(--navy)}
.road a.now .dot::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:3px solid var(--amber);animation:ping 1.6s ease-out infinite}
.road .t{flex:1;font-weight:700;font-size:18px}.road .t small{display:block;font-weight:500;color:var(--muted);font-size:14px}
.road a.done .t{color:var(--muted)}
.road .chev{color:var(--steel2);font-size:26px}
.road a.now .chev{color:var(--amber)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.tile{background:#fff;border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px;text-decoration:none;color:var(--navy);box-shadow:0 1px 0 var(--steel2),0 8px 20px #0d22380d;min-height:126px;transition:transform .15s;border:0;text-align:left;font:inherit;cursor:pointer}
.tile:active{transform:scale(.96)}
.tile .ic{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;color:#fff}
.tile .ic svg{width:26px;height:26px}
.tile b{font:700 20px/1.1 var(--cond)}.tile small{color:var(--muted);font-size:14px;line-height:1.3}
.focus{border:3px solid var(--amber);animation:slidein .45s var(--ease)}
@keyframes slidein{from{opacity:0;transform:translateX(40px)}}
.fhead{display:flex;gap:12px;align-items:center;font-weight:700;color:var(--muted)}
.pin.big{flex:0 0 54px;width:54px;height:54px;font-size:30px}
.ftext{font-size:21px;line-height:1.45;font-weight:600;margin:12px 0 0;color:var(--ink)}
.fdots{display:flex;gap:6px;margin-top:14px}.fdots i{flex:1;height:8px;border-radius:9px;background:var(--steel)}.fdots i.on{background:var(--green)}.fdots i.cur{background:var(--amber)}
.alldone{background:#E2F3E8;border:3px solid var(--green);border-radius:18px;padding:18px;margin-top:14px;text-align:center;animation:pop .5s}
.alldone b{font:700 26px var(--cond);color:var(--green)}
.pinG.dim{opacity:.35}.pinG.cur circle.pb{stroke-width:4}
.linkbtn{display:block;text-align:center;margin:16px 0 4px;font-size:16px;background:none;border:0;color:var(--teal);font-weight:700;cursor:pointer;width:100%}
/* no signal + install + videos */
#netbar>div{padding:10px 20px;font-size:15px;line-height:1.35}
#netbar .off{background:#22364C;color:#fff}#netbar .off b{color:var(--amber)}
#netbar .wait{background:#FFF4D6;color:#5a4300;border-bottom:1px solid #F2D27A}
.offl{display:flex;gap:9px;align-items:flex-start;font-size:14px;line-height:1.35;color:var(--muted);margin:12px 4px 0}
.offl i{flex:none;width:10px;height:10px;border-radius:50%;background:var(--green);margin-top:5px}
.offl.wip i{background:var(--amber);animation:glow 1.6s ease-in-out infinite}
.offsum{background:var(--paper);border:1px solid var(--steel);border-radius:12px;padding:10px 12px;margin:12px 0 0;font-size:15px}
.install{border:2px solid var(--teal);margin-bottom:14px}
.install ol,.inst{margin:6px 0 0;padding-left:22px}.install li{margin:6px 0}
.shareic{display:inline-block;vertical-align:-3px;width:18px;height:18px}
.vids{border:2px solid var(--navy)}
.vids .lbl{font:700 13px var(--cond);letter-spacing:.08em;color:var(--red)}
.vid{border-top:1px solid var(--steel);margin-top:12px;padding-top:12px}
.vid summary{list-style:none;display:flex;gap:12px;align-items:center;cursor:pointer}
.vid summary::-webkit-details-marker{display:none}
.vid .th{position:relative;flex:none;width:112px;height:63px;border-radius:10px;overflow:hidden;background:var(--navy2)}
.vid .th img{width:100%;height:100%;object-fit:cover;display:block}
.vid .play{position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-size:22px;text-shadow:0 1px 6px #000c}
.vid .len{position:absolute;right:4px;bottom:4px;background:#000c;color:#fff;font-size:11px;font-weight:600;padding:0 5px;border-radius:4px}
.vid .vt b{display:block;font-size:16px;line-height:1.25}
.vid .vt small{display:block;color:var(--muted);font-size:13px;line-height:1.3;margin-top:3px}
.vid[open] summary .vt b{color:var(--teal)}
.vhow{padding:10px 0 2px}.vhow p{margin:0 0 6px}.vhow ol{margin:0 0 8px;padding-left:22px}.vhow li{margin:5px 0}
.vidlink{border-color:var(--red)!important;color:var(--red)!important}
.photos button.nophoto{background:repeating-linear-gradient(45deg,var(--steel),var(--steel) 8px,#e9eef2 8px,#e9eef2 16px)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

   $('#snapsave').onclick=async()=>{const res=Object.assign({},jj.results||{},{new_model:$('#snapmodel').value.trim(),new_serial:$('#snapserial').value.trim(),install_date:today()});const rs=await send('fb_save_results',{tok:TOK(),job:jj.id,res,st:jj.status==='Scheduled'?'In progress':jj.status});if(rs.error)return toast('Not saved: '+rs.error.message);jj.results=res;if(jj.status==='Scheduled')jj.status='In progress';saveCopy();toast(rs.queued?QMSG:'Model and serial saved ✓');const r=$('#snapsave').getBoundingClientRect();burst(r.left+r.width/2,r.top)}}}
 if(m=h.match(/^sec-(.+)-[a-z]+$/)){const j=job(m[1]);if(!j)return;
  const hb=$('[data-here]');if(hb)hb.onclick=()=>{const s=store.get('fb-j-'+j.id,{});s.here=true;store.set('fb-j-'+j.id,s);const f=(j.steps||[]).findIndex((_,si)=>!stepDone(j,si));location.hash=`step-${j.id}-${Math.max(0,f)}`};
  $$('[data-pack]').forEach(b=>b.onchange=()=>{const pk=store.get('fb-pack-'+j.id,{});pk[b.dataset.pack]=b.checked;store.set('fb-pack-'+j.id,pk);b.closest('.chk').classList.toggle('on',b.checked)});
  const rf=$('#resform');if(rf)rf.onsubmit=async e=>{e.preventDefault();const f=Object.assign({},j.results||{},Object.fromEntries(new FormData(e.target)));const status=f.status;delete f.status;const rs=await send('fb_save_results',{tok:TOK(),job:j.id,res:f,st:status});if(rs.error)return toast('Not saved: '+rs.error.message);Object.assign(j,{results:f,status});saveCopy();toast(rs.queued?QMSG:'Results saved ✓');const r=e.target.querySelector('.btn').getBoundingClientRect();burst(r.left+r.width/2,r.top)}}
 if(m=h.match(/^step-(.+)-(\d+)$/)){const j=job(m[1]),si=+m[2];if(!j)return;
  const pins=$$('.pinG');const focusMode=!!$('#fcard');
  const sync=()=>{const c=checks(j);const cur=(j.steps[si].tasks||[]).findIndex((_,t)=>!c[si+'-'+t]);(j.steps[si].tasks||[]).forEach((_,ti)=>{const on=!!c[si+'-'+ti];pins[ti]?.classList.toggle('hit',on);pins[ti]?.classList.toggle('cur',focusMode&&ti===cur);pins[ti]?.classList.toggle('dim',focusMode&&ti!==cur&&!on);document.querySelector(`[data-row="${ti}"]`)?.classList.toggle('on',on)});$('#nextbtn')?.classList.toggle('glow',stepDone(j,si))};
  $$('.tick').forEach(b=>b.onchange=()=>{const c=checks(j);c[b.dataset.k]=b.checked;store.set('fb-'+j.id,c);sync();if(b.checked){const r=b.getBoundingClientRect();burst(r.left+15,r.top+15);if(stepDone(j,si))toast('Step '+(si+1)+' done ✓')}});
  $$('[data-row]').forEach(r=>r.addEventListener('click',e=>{if(e.target.classList.contains('tick'))return;const p=pins[+r.dataset.row];if(p){p.classList.remove('focus');void p.getBBox();p.classList.add('focus');$('#stage').scrollIntoView({behavior:'smooth',block:'center'})}}));
  sync();
  const fd=$('#fdone');if(fd)fd.onclick=()=>{const c=checks(j);c[si+'-'+fd.dataset.ti]=true;store.set('fb-'+j.id,c);const r=fd.getBoundingClientRect();burst(r.left+r.width/2,r.top);if(stepDone(j,si))toast('Step '+(si+1)+' done ✓');dir='still';route();if(stepDone(j,si))setTimeout(()=>$('#nextbtn')?.scrollIntoView({behavior:'smooth',block:'center'}),150)};
  const fp=$('#fprev');if(fp)fp.onclick=()=>{const c=checks(j);c[si+'-'+fp.dataset.ti]=false;store.set('fb-'+j.id,c);dir='still';route()};
  $$('[data-list]').forEach(b=>b.onclick=()=>{store.set('fb-listmode',b.dataset.list==='1');dir='still';route()});
  const w=j.steps[si].widget;
  $$('[data-meg]').forEach(b=>b.onclick=()=>{$('#nd').style.transform=`rotate(${b.dataset.meg}deg)`;if(b.dataset.stop)setTimeout(()=>{location.hash=`stop-${j.id}-${si}-m`},1300);else toast('Matches the office note. Go to the next step.')});
  $$('[data-dec]').forEach(b=>b.onclick=()=>{const o=w.options[+b.dataset.dec];if(o.tone==='stop'){location.hash=`stop-${j.id}-${si}-${b.dataset.dec}`;return}$('#dres').innerHTML=`<div class="ok"><b>✓ ${esc(o.result)}</b></div>`});
  const tb=$('#tbtn');if(tb){let t=null,left=600;tb.onclick=()=>{if(t){clearInterval(t);t=null;left=600;$('#timer').textContent='10:00';tb.textContent='Start the 10-minute timer';return}tb.textContent='Stop / reset';t=setInterval(()=>{left--;$('#timer').textContent=`${Math.floor(left/60)}:${String(left%60).padStart(2,'0')}`;if(left<=0){clearInterval(t);t=null;try{navigator.vibrate&&navigator.vibrate([300,150,300])}catch(e){}$('#timer').textContent='Done';tb.textContent='Start again';toast('10 minutes up: is it still under 500?')}},1000)}}
  const mic=$('#illmic');if(mic){let v=2400;const it=setInterval(()=>{if(!document.body.contains(mic))return clearInterval(it);v=v>480?Math.round(v*.9):2400;mic.textContent=v},400)}
 }

let lastIdx=0;
async function route(){NET.pending=false;const h=location.hash.slice(1)||(store.get('fb-seen-help',false)?'today':'help');
 if(h==='help')store.set('fb-seen-help',true);
 if(h==='lock'){const t=TOK();setTOK('');history.replaceState(null,'',location.pathname);try{await api.rpc('fb_logout',{tok:t})}catch(e){}start();return}
 let html,m;
 if(m=h.match(/^stop-(.+)-(\d+)-(\w+)$/)){const j=job(m[1]);const w=j&&j.steps[+m[2]]&&j.steps[+m[2]].widget;const why=m[3]==='m'?(w&&w.high):(w&&w.options&&w.options[+m[3]]&&w.options[+m[3]].result);html=vStop(m[1],m[2],why)}
 else if(m=h.match(/^step-(.+)-(\d+)$/))html=vStep(m[1],+m[2]);
 else if(m=h.match(/^sec-(.+)-([a-z]+)$/))html=vSec(m[1],m[2]);
 else if(m=h.match(/^job-(.+)$/))html=vJob(m[1]);
 else if(m=h.match(/^unit-(.+)$/))html=vUnit(m[1]);
 else html=({jobs:vJobs,units:vUnits,fixes:vFixes,help:vHelp}[h]||vToday)();
 const keep=dir==='still'?window.scrollY:0;$('#app').innerHTML=html;window.scrollTo(0,keep);wire(h);dir='fwd'}
function vLogin(msg){return `<div class="login"><div class="card"><div style="font:700 38px var(--cond);color:var(--navy)">Field Book</div><p class="muted" style="margin:4px 0 16px">Enter your code</p><div class="dots" aria-live="polite">${[0,1,2,3].map(i=>`<span data-d="${i}"></span>`).join('')}</div><div class="pad">${[1,2,3,4,5,6,7,8,9,'',0,'⌫'].map(k=>k===''?'<span></span>':`<button type="button" data-key="${k}" aria-label="${k==='⌫'?'Delete':k}">${k}</button>`).join('')}</div><p id="lmsg" class="muted" style="min-height:22px;font-size:15px">${esc(msg||'')}</p></div></div>`}
function wireLogin(){let code='';const dots=$$('[data-d]'),m=$('#lmsg');const show=()=>dots.forEach((d,i)=>d.classList.toggle('on',i<code.length));
 const press=async k=>{if(k==='⌫'){code=code.slice(0,-1);show();return}if(code.length>=4)return;code+=k;show();
  if(code.length===4){m.textContent='Checking…';let data,error;try{({data,error}=await within(api.rpc('fb_login',{code}),15000))}catch(e){error=e}if(error&&isNet(error)){m.textContent='No signal. You need signal to type your code the first time.';code='';show();return}
   if(error){m.textContent=/many/i.test(error.message)?error.message:'Wrong code. Try again.';code='';show();const d=$('.dots');d.classList.add('shake');setTimeout(()=>d.classList.remove('shake'),500);return}
   setTOK(data);askPersist();$('.login .card').classList.add('ok');setTimeout(start,450)}};
 $$('[data-key]').forEach(b=>b.onclick=()=>press(b.dataset.key));
 document.onkeydown=e=>{if($('#lmsg')){if(/^[0-9]$/.test(e.key))press(e.key);else if(e.key==='Backspace')press('⌫')}}}
function vNoSignal(){return `<div class="login"><div class="card"><div style="font:700 38px var(--cond);color:var(--navy)">Field Book</div><p style="margin:8px 0 16px">No signal right now. Field Book needs signal <b>one time</b> to save your jobs on this phone. After that it works with no signal.</p><button class="btn" id="retry">Try again</button></div></div>`}
async function start(){
 if(!TOK()){$('#app').innerHTML=vLogin(navigator.onLine?'':'No signal. You need signal to type your code the first time.');wireLogin();return}
 IDB.keys('photos').then(k=>{NET.saved=new Set(k);updNet()});countOut();
 const c=await IDB.get('kv','data');
 if(c&&c.data){setDB(c.data);NET.at=c.at;NET.from=navigator.onLine?'start':'saved';route();refresh();return}
 try{await load()}catch(e){
  if(isAuth(e)){setTOK('');$('#app').innerHTML=vLogin('Please enter your code again.');wireLogin();return}
  if(isNet(e)){$('#app').innerHTML=vNoSignal();$('#retry').onclick=start;return}
  setTOK('');$('#app').innerHTML=vLogin('Could not load: '+e.message);wireLogin();return}
 route();prefetch()}
window.addEventListener('hashchange',route);
/* update by itself: when the app opens, comes back to the screen, or signal comes back */
window.addEventListener('online',()=>{updNet();NET.last=0;refresh()});
window.addEventListener('offline',()=>{NET.from='saved';updNet()});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')refresh()});
window.addEventListener('pageshow',e=>{if(e.persisted)refresh()});
setInterval(()=>{if(document.visibilityState==='visible')refresh()},10*60*1000);
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'))navigator.serviceWorker.register('sw.js').catch(()=>{});
start();
}
